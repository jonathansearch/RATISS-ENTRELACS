[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ratiss-entrelacs"
version = "0.4.0"
description = "Processeur in silico inspiré du calcul cérébral, à branches, voies E/I et plasticité adaptative"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
